
name: google-calendar-analytics
recipe: laravel

config:
  php: '8.3'
  composer_version: '2-latest'
  via: apache
  webroot: public
  database: mysql:8.0
  cache: none
  xdebug: false

services:
  database:
    portforward: 56789

  node:
    type: node:22
    port: 5173
    command: tail -f /dev/null
